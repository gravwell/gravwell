[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
	Log-Level=DEBUG
	Log-File=/opt/gravwell/log/llm_ingester.log
	# Only a stand-in load balancer is trusted. The test client reaches the
	# container from a private Docker address, which is not listed.
	Trusted-Proxy=198.51.100.10

[Listener "openai"]
	Bind=":4180"
	# Nothing listens here. Request events are ingested before the upstream is
	# contacted, so each send yields its user message entry and a 502.
	Upstream-URL="http://127.0.0.1:1"
	Protocol="openai-chat"
	Tag-Name=llm-xff-untrusted
	Log-Mode="user"
