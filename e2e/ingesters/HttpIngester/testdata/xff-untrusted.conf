[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
    Log-Level=DEBUG
    Bind=":80"
    Log-File=/opt/gravwell/log/http_ingester.log
    Health-Check-URL="/health/check"
    # Only a stand-in load balancer is trusted. The test client reaches the
    # container from a private Docker address, which is not listed.
    Trusted-Proxies=198.51.100.10

[Listener "ingest"]
	URL="/ingest"
	Tag-Name=http-xff-untrusted
