[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
    Log-Level=DEBUG
    Bind=":80"
    Log-File=/opt/gravwell/log/http_ingester.log
    Health-Check-URL="/health/check"

[HEC-Compatible-Listener "testing"]
	URL="/services/collector"
	TokenValue="token"
	Tag-Name=hec-testing
	Debug-Posts=true
