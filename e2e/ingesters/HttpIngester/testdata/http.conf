[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
    Log-Level=DEBUG
    Bind=":80"
    Log-File=/opt/gravwell/log/http_ingester.log #optional log file
    Health-Check-URL="/health/check"

[Listener "ingest"]
	URL="/ingest"
	Tag-Name=http

[Listener "auth"]
	URL="/ingest/auth"
	Tag-Name=http-auth
	AuthType=basic
	Username=username
	Password=password

[Listener "jwt"]
	URL="/jwt"
	Tag-Name=http-jwt
	AuthType=jwt
	LoginURL="/jwt/login"
	Username=username
	Password=password

[Listener "cookie"]
	URL="/cookie"
	Tag-Name=http-cookie
	AuthType=cookie
	LoginURL="/cookie/login"
	Username=username
	Password=password

[Listener "token"]
	URL="/token"
	Tag-Name=http-token
	AuthType="preshared-token"
	TokenName=Gravwell
	TokenValue=Secret

# Example using a token in a query parameter that is preshared, no login
[Listener "param"]
	URL="/param"
	Tag-Name=http-param
	AuthType="preshared-parameter"
	TokenName=Gravwell
	TokenValue=Secret
#
# Example using a preshared value in a header
[Listener "header"]
	URL="/header"
	Tag-Name=http-header
	AuthType="preshared-header"
	TokenName=Gravwell
	TokenValue=Secret
