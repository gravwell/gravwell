[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
    Log-Level=DEBUG
    Bind=":80"
    Log-File=/opt/gravwell/log/http_ingester.log
    Health-Check-URL="/health/check"
    # The test client reaches the container through the Docker port mapping, so
    # the peer is a private Docker address. 198.51.100.10 stands in for a load balancer.
    Trusted-Proxies=10.0.0.0/8
    Trusted-Proxies=172.16.0.0/12
    Trusted-Proxies=192.168.0.0/16
    Trusted-Proxies=198.51.100.10

[Listener "ingest"]
	URL="/ingest"
	Tag-Name=http-xff
