[Global]
	Ingest-Secret = "{{ .Ingest_Secret }}"
	Connection-Timeout = "{{ .Connection_Timeout }}"
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target={{ index .Cleartext_Backend_Target 0 }}
	Log-Level=DEBUG
	Log-File=/opt/gravwell/log/azure_event_hubs.log

[EventHub "test"]
	# "emulator" is the in-network alias of the Event Hubs emulator container
	# (see e2e.WithDefaults(t, "emulator", ...)); no real Azure namespace is used.
	Event-Hubs-Endpoint=emulator
	Event-Hub=test
	Consumer-Group=cg1
	Token-Name=RootManageSharedAccessKey
	Token-Key=emulatorSasKeyNotForProduction==
	Initial-Checkpoint=start
	Tag-Name=azureeventhubs
	Parse-Time=false
