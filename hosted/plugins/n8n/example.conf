[Global]
Label="n8n"
#Ingester-UUID="90000000-0000-0000-0000-000000000000" #example UUID, remember to set
# These are standard Hosted Runner global options. Reuse the existing [Global]
# configuration for an established runner; the plugin does not change it.
Ingest-Secret="REPLACE_WITH_GRAVWELL_INGEST_SECRET"
Encrypted-Backend-Target="gravwell.example.com:4024"
Insecure-Skip-TLS-Verify=false
Ingest-Cache-Path="/opt/gravwell/cache/n8n.cache"
Max-Ingest-Cache=1024

[State]
Path="/opt/gravwell/state/n8n.state"
Sync=true

[N8n "primary"]
Ingester-UUID="291e5806-07f4-4533-a979-3296263389bf" # example UUID; use a distinct persistent UUID per stanza
Base-URL="https://n8n.example.com/api/v1"
# Keep Allow-Plaintext=false except for loopback or isolated tests; true sends the API key in cleartext.
Allow-Plaintext=false
Credential-File="/opt/gravwell/secrets/n8n-api-key"
# Alternatively, set Credential="REPLACE_WITH_N8N_API_KEY" directly.
# Credential-File takes precedence when both are configured.
Dataset="audit"
Dataset="credentials"
Dataset="executions"
Dataset="projects"
Dataset="tags"
Dataset="users"
Dataset="variables"
Dataset="workflows"
Request-Interval=300
Requests-Per-Minute=30
Page-Size=100
Max-Pages=1000
