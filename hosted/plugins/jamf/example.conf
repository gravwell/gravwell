[Global]
	#Ingester-UUID="90000000-0000-0000-0000-000000000000" #example UUID, remember to set
	Ingest-Secret = "IngestSecrets"
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target=127.0.0.1:4023

	# always enable the cache for hosted ingesters
	Ingest-Cache-Path=/opt/gravwell/cache/hosted_runner.cache
	Max-Ingest-Cache=1024

	Log-Level=INFO
	Log-File=/opt/gravwell/log/hosted_runner.log

[State]
	Path="/opt/gravwell/etc/hosted_runner.state"
	Sync=false

[Jamf "yourserver"]
	Ingester-UUID="99100000-0000-0000-0000-000000000000" #example UUID, remember to set
	Host=https://yourserver.jamfcloud.com
	Client-Id="api-client-id"
	Client-Secret="api-client-secret"

	# Optional, shown with defaults:
	#Tag-Name=jamf
	#Page-Size=100
	#Lookback=1              # hours; how far back to look on first run
	#Requests-Per-Minute=60
	#Request-Interval=600    # seconds between poll cycles
	#Sections=GENERAL
	#Sections=DISK_ENCRYPTION
	#Sections=STORAGE
