[Global]
Label="Slack Audit"
Ingester-UUID="REPLACE_WITH_PERSISTENT_UUID"
Ingest-Secret-File="/opt/gravwell/secrets/ingest.secret"
Encrypted-Backend-Target="gravwell.example.com:4024"
Insecure-Skip-TLS-Verify=false
Ingest-Cache-Path="/opt/gravwell/cache/slack.cache"
Max-Ingest-Cache=1024

[State]
Path="/opt/gravwell/state/slack.state"
Sync=true

[Slack "primary"]
Ingester-UUID="REPLACE_WITH_DISTINCT_PERSISTENT_UUID"
Base-URL="https://api.slack.com"
Credential-File="/opt/gravwell/secrets/slack-token"
Dataset="audit-logs"
Tag-Name="slack-audit"
Scope-Identity="REPLACE_WITH_ORGANIZATION_ID"
Request-Interval=300
Requests-Per-Minute=30
Page-Size=100
Max-Pages=1000
