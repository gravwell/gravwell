[Global]
	Ingest-Secret = "IngestSecrets"
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
	#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
	#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection

	##a named pipe connection, this should be used when ingester is on the same machine as a backend
	#Pipe-Backend-Target=/opt/gravwell/comms/pipe

	# always enable the cache for hosted ingesters
	Ingest-Cache-Path=/opt/gravwell/cache/hosted_runner.cache
	Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net

	# log levels and output files
	Log-Level=INFO
	Log-File=/opt/gravwell/log/hosted_runner.log

# configure the state file for hosted ingesters
[State]
	Path="/opt/gravwell/etc/hosted_runner.state"
	Sync=false #do NOT flush to disk on every sync (sync=true mode can be expensive if disks are slow)

# This plugin speaks MQTT version 5 only, it cannot connect to a broker limited
# to MQTT 3.1.1 such as Mosquitto 1.x or Azure IoT Hub.
[MQTT "sensors"]
	Ingester-UUID="7db1995f-0000-0000-0000-000000000001" #example UUID, remember to set
	Broker="tls://mqtt.example.com:8883" #repeat for a failover list
	Topic="factory/+/temp"               #repeat to subscribe to more than one filter
	Topic="factory/+/pressure"
	QoS=1                                #QoS 0 has no acknowledgement and so no delivery guarantee
	Tag-Name="mqtt"
	Client-ID="gravwell-mqtt-1"          #must be stable across restarts or the durable session is lost
	Username="gravwell"
	Password="examplepassword"
	Shared-Group="gravwell"              #let the broker load balance across several runners
	Topic-Route="factory/line1/*:mqttline1" #globs, NOT mqtt filters, "*" does not cross a "/"
	Topic-Route="factory/*/heartbeat:"      #an empty tag drops matching messages
	Max-In-Flight=512                    #unacknowledged messages the broker may have outstanding
	Session-Expiry=600                   #seconds the broker holds our session after a disconnect
	Keep-Alive=30
	Extract-Timestamps=true              #MQTT carries no publish time, search the payload for one
