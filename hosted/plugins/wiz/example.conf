[Global]
    #Ingester-UUID="90000000-0000-0000-0000-000000000000" #example UUID, remember to set
	Ingest-Secret = "IngestSecrets"
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify=false

	Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
	#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
	#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection

	##a named pipe connection, this should be used when ingester is on the same machine as a backend
	#Pipe-Backend-Target=/opt/gravwell/comms/pipe

	# always enable the cache for hosted ingesters
	Ingest-Cache-Path=/opt/gravwell/cache/hosted_runner.cache
	Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net

	# log levels and output files
	Log-Level=INFO
	Log-File=/opt/gravwell/log/hosted_runner.log

# configure the state file for hosted ingesters
[State]
	Path="/opt/gravwell/etc/hosted_runner.state"
	Sync=false #do NOT flush to disk on every sync (sync=true mode can be expensive if disks are slow)

[Wiz "cloud-security"]
	Ingester-UUID="99b00000-0000-0000-0000-000000000000" #example UUID, remember to set
	# The tenant specific GraphQL endpoint from the Wiz console (Settings -> API).
	# The host must be under app.wiz.io.
	Endpoint="https://api.us1.app.wiz.io/graphql"
	Client-Id="your-service-account-client-id"
	Client-Secret="your-service-account-client-secret"

	# Tag-Name is required. All event types (VulnerabilityFinding, Issues,
	# Detection, ConfigurationFinding, Audit) land here unless a Tag-Override
	# routes one elsewhere.
	Tag-Name="wiz"
	# Optional per-source routing, "source:tag". Valid sources are
	# VulnerabilityFinding, Issues, Detection, ConfigurationFinding, and Audit.
	#Tag-Override="Audit:wiz-audit"
	#Tag-Override="Detection:wiz-detections"
	#Tag-Override="ConfigurationFinding:wiz-config"
	#Tag-Override="VulnerabilityFinding:wiz-vulns"

	Lookback=24            #hours of history to pull on the first scan of each source
	Requests-Per-Minute=60 #stay under the Wiz API rate limit
	Request-Interval=300   #seconds between poll cycles
	Page-Size=100          #nodes requested per GraphQL page
	Max-Pages-Per-Type=20  #pages drained per source per poll cycle

	# Advanced: replace a source's built-in query with one you've verified in the
	# Wiz API Explorer, "source:/path/to/query.graphql". Use this if your tenant
	# exposes different fields, or to add a server-side time filter (declare a
	# $since variable and the plugin will feed it the tracked high-water-mark).
	#Query-Override="Audit:/opt/gravwell/etc/wiz/audit.graphql"

	# Auth-URL and Audience only need to be set for non-commercial (gov/fedramp)
	# tenants. Audience defaults to "wiz-api"; gov tenants use a different value.
	#Auth-URL="https://auth.gov.wiz.io/oauth/token"
	#Audience="wiz-gov-api"
