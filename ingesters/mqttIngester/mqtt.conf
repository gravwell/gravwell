[Global]
Ingest-Secret = "IngestSecrets"
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/opt/gravwell/comms/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/mqtt.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/opt/gravwell/log/mqtt.log

# The MQTT ingester speaks MQTT version 5 only.  It will not connect to a
# broker that is limited to MQTT 3.1.1 (for example Mosquitto 1.x).

[Subscription "default"]
	Broker="mqtt://127.0.0.1:1883" #repeat for a failover list
	Topic="gravwell/#"             #repeat to subscribe to more than one filter
	Default-Tag=mqtt

############## Example Subscription Configs #####################
#
#[Subscription "sensors"]
#	Broker="tls://mqtt.example.com:8883" #schemes: mqtt, tls, ws, wss (ports default per scheme)
#	Broker="tls://mqtt-backup.example.com:8883" #additional brokers are tried in order
#	Client-ID="gravwell-mqtt-1" #must be stable across restarts or the durable session is lost
#	Topic="factory/+/temp"
#	Topic="factory/+/pressure"
#	QoS=1 #0, 1, or 2.  QoS 0 has no acknowledgement and therefore no delivery guarantee
#	Default-Tag=mqtt
#
#	#Shared-Group makes the broker load balance across every ingester using the
#	#same group, so several ingesters can split one firehose.  Each topic is
#	#subscribed as $share/<group>/<topic>.
#	Shared-Group="gravwell"
#
#	#Topic-Route sends matching topics to a different tag.  The match is a glob
#	#(NOT an MQTT filter) and "*" does not cross a "/" boundary.  First match
#	#wins.  An empty tag drops the message.
#	Topic-Route="factory/line1/*:mqtt-line1"
#	Topic-Route="factory/line2/*:mqtt-line2"
#	Topic-Route="factory/*/heartbeat:" #matching messages are discarded
#
#	Username="gravwell"
#	Password="secret"
#
#	#TLS material, only needed when the broker requires it
#	CA-Cert="/opt/gravwell/etc/mqtt-ca.pem"
#	Client-Cert="/opt/gravwell/etc/mqtt-client.pem" #mutual TLS, must be set with Client-Key
#	Client-Key="/opt/gravwell/etc/mqtt-client.key"
#	Insecure-Skip-TLS-Verify=false
#
#	Max-In-Flight=512  #unacknowledged messages the broker may have outstanding
#	Session-Expiry=600 #seconds the broker holds our session after a disconnect
#	Keep-Alive=30      #seconds between keepalive pings
#	#Synchronous forces a sync to the indexer before acknowledging each message.
#	#A sync always costs at least 10ms and messages arrive one at a time, so
#	#this caps a subscription at roughly 100 messages/second. Use it only when
#	#losing an in-flight message on a crash is worse than the throughput.
#	Synchronous=true
#
#	#By default the topic, qos, retain flag, content type and every MQTT v5 user
#	#property are attached to the entry as enumerated values.  The payload itself
#	#is always left untouched.
#	Disable-Metadata=false
#
#	Source-Override="DEAD::BEEF" #override the source for just this subscription
#
#	#MQTT carries no publish timestamp, so entries are stamped on arrival unless
#	#Extract-Timestamps is set, in which case the payload is searched for one.
#	Extract-Timestamps=true
#	Assume-Local-Timezone=false
