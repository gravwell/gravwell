[Global]
Ingest-Secret = IngestSecrets
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/opt/gravwell/comms/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/macos_unified_log.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/opt/gravwell/log/macos_unified_log.log

# Each Stream stanza runs its own `log stream` process.
# With no filters a stream carries every default level event on the system.
[Stream "system"]
	Tag-Name=macos
	#Level=info # default, info, or debug; info and debug are far more verbose
	#Ignore-Timestamps=true # use the time the event was read rather than the event's own timestamp
	#Source-Override="DEAD::BEEF" #override the source for just this stream

# Streams can be narrowed with an NSPredicate, one or more processes, and event types,
# then routed to their own tag. The predicate is handed to log as-is, no shell quoting is needed.
#[Stream "auth"]
#	Tag-Name=macos-auth
#	Predicate="subsystem == 'com.apple.Authorization' OR process == 'sudo'"
#	Type=log
#	Type=activity
#	#Process=loginwindow # a process name or PID, may be repeated
#	#Include-Source=true # include symbol names and source line numbers where available
