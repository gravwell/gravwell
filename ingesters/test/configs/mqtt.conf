[Global]
Ingest-Secret = "IngestSecrets"
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/tmp/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
Log-Level=INFO
Log-File=/tmp/mqtt.log

############## Example Subscription Configs #####################
[Subscription "default"]
	Broker="mqtt://127.0.0.1:1883"
	Topic="gravwell/#"
	Default-Tag=default

[Subscription "sensors"]
	Broker="tls://mqtt.example.com:8883"
	Broker="tls://mqtt-backup.example.com"
	Client-ID="gravwell-mqtt-1"
	Topic="factory/+/temp"
	Topic="factory/+/pressure"
	QoS=2
	Default-Tag=mqtt
	Shared-Group="gravwell"
	Topic-Route="factory/line1/*:mqttline1"
	Topic-Route="factory/line2/*:mqttline2"
	Topic-Route="factory/*/heartbeat:"
	Username="gravwell"
	Password="secret"
	Insecure-Skip-TLS-Verify=true
	Max-In-Flight=1024
	Session-Expiry=900
	Keep-Alive=45
	Synchronous=true
	Disable-Metadata=false
	Source-Override="DEAD::BEEF"
	Extract-Timestamps=true
	Assume-Local-Timezone=true
	Preprocessor=gz

[Subscription "ws"]
	Broker="ws://127.0.0.1"
	Topic="telemetry/+"
	QoS=1
	Default-Tag=wsmqtt
	Ignore-Timestamps=true
	Disable-Metadata=true

[preprocessor "gz"]
	Type=gzip
	Passthrough-Non-Gzip=true
