[Global]
Ingest-Secret = "IngestSecrets"
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/opt/gravwell/comms/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/sqs.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/opt/gravwell/log/sqs.log

# A Queue pulls from a specific SQS queue with a given AKID and Secret. See
# https://docs.aws.amazon.com/general/latest/gr/aws-sec-cred-types.html#access-keys-and-secret-access-keys
# for information about obtaining an AKID/Secret for your user.
[Queue "default"]
	Region="us-east-2"
	Queue-URL="https://us-east-2.amazon..."
	Tag-Name="sqs"
	Credentials-Type=static
	#Endpoint="http://localhost:9324" #optional, for use with local SQS-compatible APIs like ElasticMQ
	AKID="AKID..."
	Secret="..."
	# To read a queue in another account by assuming an IAM role there.
	# Remove AKID and Secret above, or set Source-Credentials-Type=static to call STS with them:
	#Credentials-Type=assumerole
	#Role-ARN="arn:aws:iam::123456789012:role/gravwell-ingest"
	#External-ID="..." #optional, must match the sts:ExternalId condition in the role's trust policy
	#Source-Credentials-Type=static #optional, credentials used to call STS: environment (default), ec2role, or static to use AKID and Secret
	#Assume-Local-Timezone=false #Default for assume localtime is false
	#Source-Override="DEAD::BEEF" #override the source for just this Queue 
