[Global]
Ingester-UUID="90feddba-2466-4220-8f77-8a80dbae293c"
	Ingest-Secret = IngestSecrets
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify = false
	Cleartext-Backend-Target = 172.17.0.2:4023
	#Pipe-Backend-Target = /opt/gravwell/comms/pipe
	Log-Level = INFO
	Log-File = llm_ingester.log
	# Persistent state for the auto-derived session tracker. Stores only
	# message hashes (never prompt content) so it can be reloaded after a
	# restart without losing in-flight conversations.
	State-Store-Location = llm_ingester.state

[Listener "openai"]
	# Where this proxy listens. Point your OpenAI client at this address
	# (set OPENAI_BASE_URL or equivalent).
	Bind = ":4180"
	# Where to forward requests. The default is the public OpenAI API.
	# Upstream-URL = "https://api.openai.com"  # default if not specified
	# Protocol module: "openai-chat" handles /v1/chat/completions
	# (streaming and non-streaming). New protocols can be added without
	# changing this file's schema.
	Protocol = "openai-chat"
	Tag-Name = llm
	# Log-Mode controls how much of each request is ingested.
	#   deltas (default): one entry per logical new event — the latest user
	#       turn, each assistant reply, each tool call, plus the usage
	#       record. Best for analytics.
	#   user-only: only ingest the latest user prompt (and the usage record
	#       if Log-Usage is true).
	#   full-conversation: ingest every message in the request body, every
	#       request. Highest fidelity, highest volume.
	Log-Mode = "deltas"
	# Whether to capture function-call / MCP tool invocations and their
	# results. These are the events that show what tools an agent is
	# actually using.
	Log-Tool-Calls = true
	# Whether to ingest the token accounting record returned with each
	# response. For streaming, this requires the client to set
	# stream_options.include_usage = true.
	Log-Usage = true
	# When true, the upstream Authorization header is stripped before being
	# forwarded. Only enable if the proxy injects its own credentials.
	Redact-Authorization = false
	# How long to retain session prefix-match state for an idle conversation.
	Session-TTL = "30m"
	# Maximum size of an inbound request body. Default is 16 MiB.
	# Max-Body = 16777216
	# Enable TLS on the proxy listener by setting both:
	# TLS-Certificate-File = /opt/gravwell/etc/llm_ingester.crt
	# TLS-Key-File = /opt/gravwell/etc/llm_ingester.key
	# Set to true if your upstream uses a self-signed cert (lab use only).
	Insecure-Skip-TLS-Verify-Upstream = false
	Preprocessor=v

[Preprocessor "v"]
	Type=vector
	Model="logbot-embedding"
	Endpoint="https://YOUR_VECTOR_EMBEDDING_ENDPOINT/v1/embeddings" 
	Token="YOUR_VECTOR_EMBEDDING_API_KEY"

