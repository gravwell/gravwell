[Global]
	Ingest-Secret = IngestSecrets
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify = false
	#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
	#Pipe-Backend-Target = /opt/gravwell/comms/pipe
	Log-Level = INFO
	Log-File = llm_ingester.log

	# (Optional) Persistent state for the auto-derived session tracker.
	# Stores only message hashes (never prompt content) so it can be
	# reloaded after a restart without losing in-flight conversations.
	State-Store-Location = llm_ingester.state

	# (Optional) How many of a request's most-recent messages the session
	# tracker compares when deciding whether a request continues an existing
	# conversation. Larger is more precise but does more work per request.
	# Defaults to 10.
	#Session-Match-Window = 10

[Listener "openai"]
	# Where this proxy listens. 
	Bind = ":4180"

	# Where to forward requests. 
	Upstream-URL = "https://api.openai.com"
	
	# Protocol module: "openai-chat" handles /v1/chat/completions
	# (streaming and non-streaming). The other built-in module is
	# "anthropic-messages" (see the [Listener "anthropic"] example below).
	Protocol = "openai-chat"

	Tag-Name = llm

	# Log-Mode controls how much of each request is ingested.
	#   delta (default): one entry per logical new event — the latest user
	#       turn, each assistant reply, each tool call, plus the usage
	#       record. 
	#   user: only ingest the user prompts — never the model's replies.
	#       Tool calls and results are still captured when Log-Tool-Calls
	#       is true, and the usage record when Log-Usage is true.
	#   full: ingest every message in the request body, every
	#       request. 
	Log-Mode = "delta"

	# Whether to capture function-call / MCP tool invocations and their
	# results. These are the events that show what tools an agent is
	# actually using.
	Log-Tool-Calls = true

	# Whether to ingest the token accounting record returned with each
	# response. For streaming, this requires the client to set
	# stream_options.include_usage = true.
	Log-Usage = true

	# Authorization gating. Both tokens are bare — the proxy speaks "Bearer"
	# to the client and the upstream on your behalf.
	#
	#   Client-Authorization: if set, inbound clients must send
	#       "Authorization: Bearer <token>" matching this value or they get a
	#       401. Leave unset to require no client authentication.
	#
	#   Upstream-Authorization: if set, this credential is injected as the
	#       Authorization header on the upstream request, replacing whatever the
	#       client sent. This lets you gate the real AI key behind the proxy.
	#       If unset, the client's own Authorization header is passed through.
	#
	# With both unset, no authorization is enforced or injected. 
	#Client-Authorization = "gateway-token-clients-must-present"
	#Upstream-Authorization = "sk-your-real-upstream-api-key"

	# How long to retain session prefix-match state for an idle conversation.
	Session-TTL = "30m"

	# If your client stamps a conversation ID on each request, name the header
	# here and the proxy will use that instead of deriving the session by
	# matching message prefixes. See the [Listener "anthropic"] block below for
	# the full explanation.
	#Session-ID-Header = "x-my-app-conversation-id"

	# Maximum size of an inbound request body. Default is 16 MiB.
	# Max-Body = 16777216
	
	# Enable TLS on the proxy listener by setting both:
	# TLS-Certificate-File = /opt/gravwell/etc/llm_ingester.crt
	# TLS-Key-File = /opt/gravwell/etc/llm_ingester.key
	
	# Set to true if your upstream uses a self-signed cert (lab use only).
	Insecure-Skip-TLS-Verify-Upstream = false

	# Optional preprocessors run on every ingested event. The example below
	# wires in a vector-embedding preprocessor; uncomment this line and the
	# matching [Preprocessor "v"] block (and fill in your endpoint/token) to
	# enable it. Left commented so the default config runs out-of-the-box.
	#Preprocessor=v

# A second listener speaking Anthropic's Messages API (/v1/messages), which is
# what Claude Code and the Anthropic SDKs use. Point a client at it with
# ANTHROPIC_BASE_URL=http://localhost:4181 (see README.md).
[Listener "anthropic"]
	Bind = ":4181"
	Upstream-URL = "https://api.anthropic.com"
	Protocol = "anthropic-messages"
	Tag-Name = llm

	Log-Mode = "delta"
	Log-Tool-Calls = true
	Log-Usage = true

	# The Messages API authenticates with a bare "x-api-key" header rather
	# than "Authorization: Bearer", so this listener uses that auth style for
	# both the client gate and the injected upstream credential. Clients that
	# authenticate with a bearer token instead (Claude Code does this when it
	# is configured with ANTHROPIC_AUTH_TOKEN rather than ANTHROPIC_API_KEY)
	# want Auth-Style = "bearer" here.
	Auth-Style = "x-api-key"

	#Client-Authorization = "gateway-token-clients-must-present"
	#Upstream-Authorization = "sk-ant-your-real-upstream-api-key"

	# The Messages API requires an "anthropic-version" header. Clients send
	# their own; this value is injected only when a request arrives without
	# one, which is what happens when the proxy is holding the upstream key
	# and the client was never configured to talk to Anthropic directly.
	Anthropic-Version = "2023-06-01"

	# Adopt the client's own conversation ID (from this header) as the
	# session ID instead of deriving one by matching message prefixes.
	#
	# This is not Anthropic-specific and is available on any listener: set it
	# to whatever header your client stamps its conversation identifier on,
	# including your own applications. It is shown here because Claude Code is
	# the client we ship a config for, and it sends x-claude-code-session-id on
	# every request. Where a client offers one, prefer it: an identifier the
	# client owns survives the history rewrites (compaction, retries, edited
	# context) that prefix matching cannot follow, and it lets an ingested
	# session be lined up with the client's own transcript.
	#
	# Unset to always derive the session by prefix matching.
	Session-ID-Header = "x-claude-code-session-id"

	Session-TTL = "30m"

	# A listener answers 404 on any path it neither parses nor recognizes as a
	# sibling of the API it speaks. The sibling endpoints a real client needs
	# are built in — the Messages API listener passes /v1/messages/count_tokens
	# through untouched (without ingesting it) because Claude Code calls it —
	# so this does not need configuring for normal use.
	#
	# Setting Allow-Unknown-Paths = true forwards *every* path to the upstream
	# instead. THIS IS INSECURE. The proxy attaches your
	# Upstream-Authorization to whatever it forwards, so an open path list
	# lets a client aim this listener at a request the proxy never inspects and
	# read your upstream credential back out of the result. Only enable it for
	# a specific client that demands an endpoint we do not know about, and
	# prefer keeping that client on its own listener.
	#Allow-Unknown-Paths = false

	Insecure-Skip-TLS-Verify-Upstream = false

# Example preprocessor: generate embeddings for each event via a
# vector-embedding endpoint. Fill in Endpoint and Token before enabling.
#[Preprocessor "v"]
#	Type=vector
#	Model="logbot-embedding"
#	Endpoint="https://YOUR_VECTOR_EMBEDDING_ENDPOINT/v1/embeddings"
#	Token="YOUR_VECTOR_EMBEDDING_API_KEY"

