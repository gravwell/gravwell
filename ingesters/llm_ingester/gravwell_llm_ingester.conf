[Global]
	Ingest-Secret = IngestSecrets
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify = false
	Cleartext-Backend-Target = 127.0.0.1:4023
	#Pipe-Backend-Target = /opt/gravwell/comms/pipe
	Log-Level = INFO
	Log-File = llm_ingester.log

	# (Optional) Persistent state for the auto-derived session tracker.
	# Stores only message hashes (never prompt content) so it can be
	# reloaded after a restart without losing in-flight conversations.
	State-Store-Location = llm_ingester.state

	# (Optional) How many of a request's most-recent messages the session
	# tracker compares when deciding whether a request continues an existing
	# conversation. Larger is more precise but does more work per request.
	# Defaults to 10.
	#Session-Match-Window = 10

[Listener "openai"]
	# Where this proxy listens. 
	Bind = ":4180"

	# Where to forward requests. 
	Upstream-URL = "https://api.openai.com"
	
	# Protocol module: "openai-chat" handles /v1/chat/completions
	# (streaming and non-streaming). 
	# Currently only "openai-chat" is supported.
	Protocol = "openai-chat"

	Tag-Name = llm

	# Log-Mode controls how much of each request is ingested.
	#   delta (default): one entry per logical new event — the latest user
	#       turn, each assistant reply, each tool call, plus the usage
	#       record. 
	#   user: only ingest the latest user prompt (and the usage record
	#       if Log-Usage is true).
	#   full: ingest every message in the request body, every
	#       request. 
	Log-Mode = "delta"

	# Whether to capture function-call / MCP tool invocations and their
	# results. These are the events that show what tools an agent is
	# actually using.
	Log-Tool-Calls = true

	# Whether to ingest the token accounting record returned with each
	# response. For streaming, this requires the client to set
	# stream_options.include_usage = true.
	Log-Usage = true

	# Authorization gating. Both tokens are bare — the proxy speaks "Bearer"
	# to the client and the upstream on your behalf.
	#
	#   Client-Authorization: if set, inbound clients must send
	#       "Authorization: Bearer <token>" matching this value or they get a
	#       401. Leave unset to require no client authentication.
	#
	#   Upstream-Authorization: if set, this credential is injected as the
	#       Authorization header on the upstream request, replacing whatever the
	#       client sent. This lets you gate the real AI key behind the proxy.
	#       If unset, the client's own Authorization header is passed through.
	#
	# With both unset, no authorization is enforced or injected. 
	#Client-Authorization = "gateway-token-clients-must-present"
	#Upstream-Authorization = "sk-your-real-upstream-api-key"

	# How long to retain session prefix-match state for an idle conversation.
	Session-TTL = "30m"

	# Maximum size of an inbound request body. Default is 16 MiB.
	# Max-Body = 16777216
	
	# Enable TLS on the proxy listener by setting both:
	# TLS-Certificate-File = /opt/gravwell/etc/llm_ingester.crt
	# TLS-Key-File = /opt/gravwell/etc/llm_ingester.key
	
	# Set to true if your upstream uses a self-signed cert (lab use only).
	Insecure-Skip-TLS-Verify-Upstream = false

	# Optional preprocessors run on every ingested event. The example below
	# wires in a vector-embedding preprocessor; uncomment this line and the
	# matching [Preprocessor "v"] block (and fill in your endpoint/token) to
	# enable it. Left commented so the default config runs out-of-the-box.
	#Preprocessor=v

# Example preprocessor: generate embeddings for each event via a
# vector-embedding endpoint. Fill in Endpoint and Token before enabling.
#[Preprocessor "v"]
#	Type=vector
#	Model="logbot-embedding"
#	Endpoint="https://YOUR_VECTOR_EMBEDDING_ENDPOINT/v1/embeddings"
#	Token="YOUR_VECTOR_EMBEDDING_API_KEY"

