[Global]
Ingest-Secret = IngestSecrets
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/opt/gravwell/comms/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/simple_relay.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/opt/gravwell/log/snmp.log

[Listener "default"]
	Tag-Name=snmp
	Bind-String="0.0.0.0:162"
	Version=2c

[Listener "v3"]
	Tag-Name=snmp3
	Bind-String="0.0.0.0:163"
	Version=3
	Username=myuser
	Auth-Passphrase=mypassword
	Auth-Protocol=SHA256   #MD5, SHA, SHA224, SHA256, SHA384, SHA512
	Privacy-Passphrase=mypassword
	#Privacy-Protocol picks the encryption used for the trap payload.
	#DES and AES (AES-128, RFC 3826) are standardized and interoperate widely.
	#The 192 and 256 bit variants are not standardized: they come in two
	#incompatible flavors that differ in how the localized key is extended.
	#AES192C/AES256C use the Reeder draft, which is what Cisco and most other
	#gear that offers 192/256 bit privacy implements, so reach for those first.
	#AES192/AES256 use the Blumenthal draft, which is rarer and is marked
	#untested upstream in gosnmp. Picking the wrong flavor is not a config
	#error and produces no log line: the traps fail to decrypt and are dropped
	#inside the SNMP library, so the listener simply never produces an entry.
	#If a listener stays silent while the agent reports sending traps, try the
	#other flavor.
	Privacy-Protocol=AES   #DES, AES (AES-128, RFC 3826), AES192, AES256, AES192C, AES256C
